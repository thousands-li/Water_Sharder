<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

  <title>Water_Sharder</title>

  <meta name="viewport" content="width=device-width,user-scalable=no,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="renderer" content="webkit"/>
  <meta name="force-rendering" content="webkit"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1"/>
  <meta name="msapplication-tap-highlight" content="no">
  <meta name="screen-orientation" content="landscape"/>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" type="text/css" href="style.css"/>
</head>
<body>
  <div id="GameDiv" cc_exact_fit_screen="false">
    <div id="Cocos3dGameContainer">
      <canvas id="GameCanvas" width="1280" height="720" oncontextmenu="event.preventDefault()" tabindex="99"></canvas>
    </div>
    <div id="LoadingOverlay" role="status" aria-live="polite" aria-label="加载中">
      <div class="loading-panel">
        <div class="loading-mark" aria-hidden="true"></div>
        <div class="loading-title">加载中</div>
        <div class="loading-status" data-loading-status>正在准备资源...</div>
        <div class="loading-bar" aria-hidden="true"><span></span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      var overlay = document.getElementById('LoadingOverlay');
      if (!overlay) {
        return;
      }

      var status = overlay.querySelector('[data-loading-status]');
      var hidden = false;
      var startedAt = Date.now();
      var lastResourceAt = startedAt;
      var lastResourceCount = 0;
      var sawGameResource = false;

      function setStatus(text) {
        if (!hidden && status) {
          status.textContent = text;
        }
      }

      function hideLoading() {
        if (hidden) {
          return;
        }

        hidden = true;
        overlay.classList.add('is-hidden');
        window.setTimeout(function () {
          if (overlay.parentNode) {
            overlay.parentNode.removeChild(overlay);
          }
        }, 650);
      }

      function hideAfterFrame() {
        window.requestAnimationFrame(function () {
          window.requestAnimationFrame(hideLoading);
        });
      }

      function noteResource(name) {
        if (!name || !/\/(?:assets|cocos-js|src)\//.test(name)) {
          return;
        }

        sawGameResource = true;
        lastResourceAt = Date.now();
      }

      function scanResourceEntries() {
        var perf = window.performance;
        if (!perf || !perf.getEntriesByType) {
          return;
        }

        var entries = perf.getEntriesByType('resource');
        for (var i = lastResourceCount; i < entries.length; i++) {
          noteResource(entries[i].name);
        }
        lastResourceCount = entries.length;
      }

      function watchResourceIdle() {
        scanResourceEntries();

        var now = Date.now();
        if (
          !hidden &&
          sawGameResource &&
          now - startedAt > 3200 &&
          now - lastResourceAt > 2600
        ) {
          setStatus('正在启动场景...');
          hideAfterFrame();
          return;
        }

        if (!hidden) {
          window.setTimeout(watchResourceIdle, 400);
        }
      }

      window.WaterShardLoader = {
        hide: hideLoading,
        setStatus: setStatus
      };

      window.setTimeout(function () { setStatus('正在加载资源...'); }, 1600);
      window.setTimeout(function () { setStatus('正在进入游戏...'); }, 5200);
      window.setTimeout(function () { setStatus('首次加载资源较大，请稍等...'); }, 11000);
      window.setTimeout(function () { setStatus('马上就好...'); }, 18000);
      window.setTimeout(hideLoading, 35000);
      window.setTimeout(watchResourceIdle, 1200);

      if (window.PerformanceObserver) {
        try {
          var resourceObserver = new PerformanceObserver(function (list) {
            list.getEntries().forEach(function (entry) {
              noteResource(entry.name);
            });
          });
          resourceObserver.observe({ entryTypes: ['resource'] });
        } catch (err) {
          // Some older browsers do not allow observing resource entries.
        }
      }

      function bindCocosEvents() {
        if (!window.System || !System.import) {
          window.setTimeout(bindCocosEvents, 50);
          return;
        }

        System.import('cc').then(function (cc) {
          var director = cc && cc.director;
          var Director = cc && cc.Director;
          var game = cc && cc.game;
          var Game = cc && cc.Game;

          if (game && Game && Game.EVENT_GAME_INITED) {
            var onGameInited = function () { setStatus('正在启动场景...'); };
            if (game.once) {
              game.once(Game.EVENT_GAME_INITED, onGameInited);
            } else if (game.on) {
              game.on(Game.EVENT_GAME_INITED, onGameInited);
            }
          }

          if (director && Director && director.once) {
            if (Director.EVENT_AFTER_SCENE_LAUNCH) {
              director.once(Director.EVENT_AFTER_SCENE_LAUNCH, hideAfterFrame);
            }

            if (Director.EVENT_AFTER_DRAW) {
              director.once(Director.EVENT_AFTER_DRAW, hideAfterFrame);
            }
          }
        }).catch(function () {
          // The fallback timer keeps the loading layer from staying forever.
        });
      }

      bindCocosEvents();

      window.addEventListener('error', function () {
        setStatus('加载遇到问题，请刷新重试');
      });
      window.addEventListener('unhandledrejection', function () {
        setStatus('加载遇到问题，请刷新重试');
      });
    }());
  </script>
  

<!-- Polyfills bundle. -->

<script src="src/polyfills.bundle.js" charset="utf-8"> </script>


<!-- SystemJS support. -->
<script src="src/system.bundle.js" charset="utf-8"> </script>

<!-- Import map -->
<script src="src/import-map.json" type="systemjs-importmap" charset="utf-8"> </script>

<script>
    System.import('./index.js').catch(function(err) { console.error(err); })
</script>

</body>
</html>
